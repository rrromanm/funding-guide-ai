[project]
name = "funding-guide-worker"
version = "0.1.0"
description = "Scrapers and matching AI for PYN"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scrapers*", "matching*"]

[tool.pytest.ini_options]